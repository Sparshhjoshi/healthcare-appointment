spring.application.name=HealthcareAppointmentManager

# Database Connection Settings (Render / External DB)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/healthcare_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port (Render will provide PORT)
server.port=${PORT:8080}

# JWT Secret
jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyPleaseChangeInProduction}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Gemini API
gemini.api.key=${GEMINI_API_KEY:YOUR_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Test Email Address
app.test.email=${APP_TEST_EMAIL:sparshj567@gmail.com}

